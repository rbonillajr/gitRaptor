[package]
name = "watcher-viability"
version = "0.0.0"
edition = "2024"
publish = false
license = "FSL-1.1-ALv2"
description = "SPIKE-GRP-002 isolated prototype: change-watcher viability at scale"

# Standalone workspace: this prototype is intentionally outside the product workspace.
[workspace]

[profile.release]
debug = 1

[dependencies]
anyhow = "1.0.104"
bstr = "1.13.1"
gix = { version = "0.88.0", default-features = false, features = ["index", "sha1", "max-performance-safe", "revision"] }
ignore = "0.4.33"
libc = "0.2.190"
notify = "8.2.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1_smol = "1.0.1"
