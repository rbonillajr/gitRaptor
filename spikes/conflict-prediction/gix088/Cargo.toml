[package]
name = "conflict-prediction-gix088"
version = "0.0.0"
edition = "2024"
publish = false
license = "FSL-1.1-ALv2"
description = "SPIKE-CKP-001: the same prototype built against gix 0.88 / gix-merge 0.21 (H9)"

# Standalone workspace: this prototype is NOT a member of the GitRaptor workspace.
[workspace]

[[bin]]
name = "ckp-spike-gix088"
path = "../src/main.rs"

[features]
default = ["gix088"]
gix088 = []

[dependencies]
gix = { version = "=0.88.0", default-features = false, features = ["sha1", "merge", "revision", "max-performance-safe"] }
gix-merge = "=0.21.0"
gix-diff = { version = "=0.68.0", default-features = false, features = ["blob"] }
gix-filter = "=0.35.0"
gix-worktree = { version = "=0.57.0", default-features = false, features = ["attributes"] }
gix-attributes = "=0.36.0"
gix-glob = "=0.28.0"
gix-index = "=0.56.0"
gix-object = "=0.65.0"
gix-hash = { version = "=0.27.0", features = ["sha1"] }
gix-command = "=0.11.0"
gix-revwalk = "=0.36.0"
gix-revision = { version = "=0.50.0", default-features = false, features = ["merge_base"] }
gix-error = "=0.4.0"
gix-validate = "=0.12.0"
libc = "0.2"
serde_json = "1"
gitraptor-testkit = { path = "../../../crates/testkit" }

[profile.release]
debug = 1
