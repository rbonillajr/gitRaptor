[package]
name = "snapshot-overhead"
version = "0.0.0"
edition = "2024"
publish = false
license = "FSL-1.1-ALv2"
description = "SPIKE-TMC-001: isolated prototype of the Time Machine snapshot store (not product code)"

# Standalone workspace: this prototype is NOT a member of the GitRaptor workspace.
[workspace]

[dependencies]
gix = { version = "0.88", default-features = false, features = ["sha1", "max-performance-safe"] }
libc = "0.2"
sha1_smol = "1"

[profile.release]
debug = 1
