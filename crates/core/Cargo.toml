[package]
name = "gitraptor-core"
description = "GitRaptor engine: watcher, oplog/snapshots, conflict prediction"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
directories = "6.0.0"
gitraptor-api.workspace = true
gitraptor-git.workspace = true
gitraptor-policy.workspace = true
rusqlite = { version = "0.40.2", features = ["bundled"] }

[lints]
workspace = true

[target."cfg(unix)".dependencies]
rustix = { version = "1.1.5", features = ["fs", "process"] }
signal-hook = "0.4.5"

[dev-dependencies]
tempfile = "3.27.0"
