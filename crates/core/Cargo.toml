[package]
name = "gitraptor-core"
description = "GitRaptor engine: watcher, oplog/snapshots, conflict prediction"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
directories = "6.0.0"
# Confirmation challenges of the Time Machine (TS-TMC-004, SEC-TMC-03).
getrandom = "0.4.3"
# File watcher of the observer (ADR-GRP-010 § 1). Pinned: every FSEvents
# stream recreation of 8.2 loses events without a mark, and a new version
# must pass the recreation scenario before it is taken (US-GRP-002, D2).
notify = "=8.2.0"
gitraptor-api = { workspace = true, features = ["client"] }
gitraptor-git.workspace = true
gitraptor-policy.workspace = true
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"

[features]
# Named cut points of the hook-layer transactions (INF-GRD-001, NFR-12): never in a release build.
test-cuts = []

[lints]
workspace = true

[target."cfg(unix)".dependencies]
# Peer credentials of the channel socket and the user's passwd entry
# (TS-GRP-004): safe wrappers, the workspace forbids `unsafe`.
nix = { version = "=0.31.3", features = ["resource", "socket", "user"] }
rustix = { version = "1.1.5", features = ["fs", "process", "net", "event", "pipe"] }
signal-hook = "0.4.5"

[target."cfg(windows)".dependencies]
# Private DACL of the profile folders (SEC-06, TD-GRP-001) and processes
# (ancestry, creation time, owner) for the requester: the only crate allowed
# `unsafe` (ADR-GRP-002, Enmienda 2026-10-05).
gitraptor-winsys.workspace = true

[target."cfg(target_os = \"macos\")".dependencies]
# `proc_pidinfo` of other processes (ancestry, controlling terminal, start
# time). Builds its bindings with bindgen (needs the Command Line Tools SDK).
libproc = "=0.14.11"
# Command line of the nearest `git` ancestor (`KERN_PROCARGS2`), read only to classify the
# subcommand of the second line (DS-US-GRD-018 § 5.3, ADR-GRP-002 Enmienda 2026-10-07).
gitraptor-macsys.workspace = true

[dev-dependencies]
gitraptor-testkit.workspace = true
schemars = "1.2.2"
tempfile = "3.27.0"

# p95 of the guaranteed prior snapshot against NFR-04 (TS-TMC-001, ADR-TMC-006 § 4).
[[bench]]
name = "tm_snapshot"
harness = false

# p95 of the channel under a slow client and a connection flood against the IPC
# budget of ADR-GRP-011 (TS-GRP-004 SEC-08, INF-GRP-002).
[[bench]]
name = "channel_flood"
harness = false
