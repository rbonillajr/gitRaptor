[package]
name = "gitraptor-core"
description = "GitRaptor engine: watcher, oplog/snapshots, conflict prediction"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
directories = "6.0.0"
# Confirmation challenges of the Time Machine (TS-TMC-004, SEC-TMC-03).
getrandom = "0.4.3"
# File watcher of the observer (ADR-GRP-010 § 1). Pinned: every FSEvents
# stream recreation of 8.2 loses events without a mark, and a new version
# must pass the recreation scenario before it is taken (US-GRP-002, D2).
notify = "=8.2.0"
gitraptor-api.workspace = true
gitraptor-git.workspace = true
gitraptor-policy.workspace = true
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"

[lints]
workspace = true

[target."cfg(unix)".dependencies]
# Peer credentials of the channel socket and the user's passwd entry
# (TS-GRP-004): safe wrappers, the workspace forbids `unsafe`.
nix = { version = "=0.31.3", features = ["socket", "user"] }
rustix = { version = "1.1.5", features = ["fs", "process", "net", "event", "pipe"] }
signal-hook = "0.4.5"

[target."cfg(target_os = \"macos\")".dependencies]
# `proc_pidinfo` of other processes (ancestry, controlling terminal, start
# time). Builds its bindings with bindgen (needs the Command Line Tools SDK).
libproc = "=0.14.11"

[target."cfg(windows)".dependencies]
# Processes on Windows (ancestry, creation time, owner): the only crate
# allowed `unsafe` (ADR-GRP-002, Enmienda 2026-10-05).
gitraptor-winsys.workspace = true

[dev-dependencies]
gitraptor-testkit.workspace = true
schemars = "1.2.2"
tempfile = "3.27.0"

# p95 of the guaranteed prior snapshot against NFR-04 (TS-TMC-001, ADR-TMC-006 § 4).
[[bench]]
name = "tm_snapshot"
harness = false
