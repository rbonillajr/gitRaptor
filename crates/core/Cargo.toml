[package]
name = "gitraptor-core"
description = "GitRaptor engine: watcher, oplog/snapshots, conflict prediction"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
directories = "6.0.0"
gitraptor-api.workspace = true
gitraptor-git.workspace = true
gitraptor-policy.workspace = true
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"

[lints]
workspace = true

[target."cfg(unix)".dependencies]
rustix = { version = "1.1.5", features = ["fs", "process"] }
signal-hook = "0.4.5"

[dev-dependencies]
gitraptor-testkit.workspace = true
tempfile = "3.27.0"

# p95 of the guaranteed prior snapshot against NFR-04 (TS-TMC-001, ADR-TMC-006 § 4).
[[bench]]
name = "tm_snapshot"
harness = false
