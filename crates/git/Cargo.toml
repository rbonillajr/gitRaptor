version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
gix.workspace = true
gix-pack.workspace = true

[target."cfg(unix)".dependencies]
rustix = { version = "1.1.5", features = ["fs", "process"] }

[dev-dependencies]
gitraptor-testkit.workspace = true
tempfile.workspace = true

[lints]
workspace = true

# Test runner, probe, shim and traps of the dynamic exec audit (INF-GRP-001).
[[test]]
name = "repo_intact_exec"
harness = false
