# INF-GRP-002: freshness, scale and footprint gates of the engine (ADR-GRP-011 § 4, NFR-04,
# NFR-05, NFR HUELLA). See the INF-GRP-002 Dev Spec.
#
# Runs `cargo bench -p gitraptor-cli --bench engine` (release build) over the 100K-commit
# reference repo with 10 worktrees, with `--gate ci`: on a shared runner the NFR-04 budget (p95
# 300 ms) is measured and reported, and what fails is a regression over the ceilings calibrated
# for that runner, confirmed by measuring the scenario again (two of three attempts). The job
# also fails on the footprint of the isolated daemon over its limits, or a change lost by the
# stream recreation. The budget itself gates on the reference machine (INF-GRP-002, Enmienda
# 2026-10-05; TD-GRP-003).
#
# It also runs `cargo bench -p gitraptor-core --bench channel_flood`: the p95 of the channel
# (`t_published` → client) under a slow client and 100 extra connections against the IPC budget
# of ADR-GRP-011 (25 ms), failing when two of three attempts are over.
#
# Where it runs (cost; Enmienda 2026-10-05): a pull request runs Linux only, the stable and most
# sensitive runner. macOS, scarce and noisy, runs on every push to main, nightly and on demand: a
# macOS-only regression turns main red after the merge, and `workflow_dispatch` with `ref` and
# `os` bisects it.
#
# Windows: the channel client is Unix-only (TS-GRP-004), so there is nothing to measure yet.
# Pendiente: etapa de validación multiplataforma.
#
# Actions are pinned by commit SHA.
name: engine-bench

on:
  pull_request:
    paths:
      - "crates/**"
      - "apps/cli/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/engine-bench.yml"
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "apps/cli/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/engine-bench.yml"
  # Nightly: catches a change in the runner image and the pushes that did not run.
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:
    inputs:
      os:
        description: Runners to measure on
        type: choice
        options: [both, ubuntu, macos]
        default: both
      ref:
        description: Commit, branch or tag to measure (default, the dispatched ref)
        type: string
        default: ""

permissions:
  contents: read
  pull-requests: read
  actions: read

# Only a pull request cancels its previous run. Every push to main is measured, and manual runs
# never cancel each other: calibrating and bisecting take several runs of the same ref.
concurrency:
  group: engine-bench-${{ github.event_name }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  engine-bench:
    name: engine bench (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # A confirmed regression measures its steps again, so a failing job takes longer.
    timeout-minutes: ${{ matrix.os == 'macos-latest' && 90 || 45 }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || (github.event_name == 'workflow_dispatch' && inputs.os == 'ubuntu' && '["ubuntu-latest"]') || (github.event_name == 'workflow_dispatch' && inputs.os == 'macos' && '["macos-latest"]') || '["ubuntu-latest","macos-latest"]') }}
    steps:
      # A nightly on a commit a push to main already measured green on both runners has nothing
      # new to say.
      - name: Nightly already measured
        id: prior
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/engine-bench.yml/runs?head_sha=$GITHUB_SHA&event=push&status=success" --jq '.total_count')"
          if [ "$n" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$GITHUB_SHA was already measured green on a push to main"
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: steps.prior.outputs.skip != 'true'
        with:
          ref: ${{ inputs.ref }}
      - name: Toolchain from rust-toolchain.toml
        if: steps.prior.outputs.skip != 'true'
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.prior.outputs.skip != 'true'
      # The reference repo is deterministic (repogen, fixed seed): generated once per generator
      # version and OS, then restored. Bump `v1` when `reference()` in the bench changes.
      - name: Reference repo (100K commits)
        if: steps.prior.outputs.skip != 'true'
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ${{ runner.temp }}/engine-bench/ref-H
            ${{ runner.temp }}/engine-bench/ref-H.done
          key: engine-bench-ref-H-v1-${{ runner.os }}-${{ hashFiles('crates/testkit/src/repogen.rs') }}
      - name: Bench and gates
        if: steps.prior.outputs.skip != 'true'
        # `runner` is not available in the job's `env`.
        env:
          ENGINE_BENCH_ROOT: ${{ runner.temp }}/engine-bench
        run: cargo bench -p gitraptor-cli --bench engine -- --gate ci --out "$ENGINE_BENCH_ROOT/engine-bench-${{ runner.os }}.json"
      # The IPC budget of ADR-GRP-011 (25 ms p95) under a slow client and a connection flood
      # (TS-GRP-004 SEC-08), in release: the debug test keeps only the functional side.
      - name: Channel under flood
        if: steps.prior.outputs.skip != 'true'
        run: cargo bench -p gitraptor-core --bench channel_flood
      # TD-GRP-003: the NFR-04 budget gates on the reference machine. A PR that touches the
      # engine is reminded to attach the report of `--gate reference` before the merge; one that
      # touches the observer, to measure it on macOS too (FSEvents), on demand.
      - name: Reference machine reminder
        if: always() && github.event_name == 'pull_request' && matrix.os == 'ubuntu-latest'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BRANCH: ${{ github.head_ref }}
        run: |
          files="$(gh pr diff "$PR" --repo "$GITHUB_REPOSITORY" --name-only)"
          if grep -qE '^crates/core/src/(watch/|daemon/|channel/|observe\.rs)' <<<"$files"; then
            msg="This PR touches the engine: attach the report of 'cargo bench -p gitraptor-cli --bench engine -- --gate reference' from the reference machine before the merge (TD-GRP-003)."
            echo "::warning::$msg"
            echo "> **NFR-04**: $msg" >> "$GITHUB_STEP_SUMMARY"
          fi
          if grep -qE '^crates/core/src/watch/' <<<"$files"; then
            msg="This PR touches the observer: measure it on macOS too with 'gh workflow run engine-bench.yml --ref $BRANCH -f os=macos'."
            echo "::warning::$msg"
            echo "> **macOS**: $msg" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Report
        if: always() && steps.prior.outputs.skip != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: engine-bench-${{ runner.os }}
          path: ${{ runner.temp }}/engine-bench/engine-bench-*.json
          if-no-files-found: warn
