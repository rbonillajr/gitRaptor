# INF-GRP-003: release pipeline (NFR-06, ADR-GRP-014).
#
# A `v*` tag builds `raptor` and `raptor-mcp` for the six targets of NFR-06, checksums them,
# tests the install scripts against the built archives, renders the distribution channels
# (INF-GRP-004) and leaves a DRAFT GitHub Release. Nothing is published here: publishing the
# draft is a human step, and the channels are published by `release-channels.yml` only after that.
#
# Pull requests that touch this pipeline run the same build as a dry run, without a release.
#
# Requires a secret (steps are skipped and warn when it is missing, ADR-GRP-014 § 4):
#   - macOS signing and notarization: APPLE_CERTIFICATE_P12_BASE64, APPLE_CERTIFICATE_PASSWORD,
#     APPLE_SIGNING_IDENTITY, APPLE_API_KEY_P8_BASE64, APPLE_API_KEY_ID, APPLE_API_ISSUER_ID.
#   - Windows signing (Azure Artifact Signing over OIDC): AZURE_CLIENT_ID, AZURE_TENANT_ID,
#     AZURE_SIGNING_ENDPOINT, AZURE_SIGNING_ACCOUNT, AZURE_CERTIFICATE_PROFILE.
# Requires the repo variable RELEASE_ATTEST == 'true': build provenance and SBOM attestations are
# public, irreversible Sigstore entries, so they stay off until the first real release.
#
# Actions are pinned by commit SHA. Release builds never restore a cache (cache poisoning).
name: release

on:
  push:
    tags: ["v*"]
  # Rebuilds an existing tag only (available once this file is on main).
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to rebuild (for example v0.1.0)
        required: true
        type: string
  pull_request:
    paths:
      - .github/workflows/release.yml
      - packaging/**

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Toolchain from rust-toolchain.toml
        run: rustup show
      # The tag must equal the workspace version exactly, prerelease suffix included, so
      # `raptor --version`, the archives and the channel manifests all name the same version.
      - id: version
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          version=$(cargo metadata --no-deps --format-version 1 --locked \
            | jq -r '.packages[] | select(.name == "gitraptor-cli") | .version')
          case "$EVENT" in
            push) tag="${GITHUB_REF#refs/tags/}"; release=true ;;
            workflow_dispatch)
              tag="$INPUT_TAG"; release=true
              git rev-parse -q --verify "refs/tags/$tag" >/dev/null \
                || { echo "::error::tag $tag does not exist"; exit 1; } ;;
            *) tag="v$version"; release=false ;;
          esac
          if [ "$tag" != "v$version" ]; then
            echo "::error::tag $tag does not match the workspace version v$version"
            exit 1
          fi
          case "$version" in *-*) prerelease=true ;; *) prerelease=false ;; esac
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "prerelease=$prerelease"
            echo "release=$release"
          } >> "$GITHUB_OUTPUT"
          echo "release $tag (version $version, prerelease $prerelease, draft release $release)"
      # SEC-07: a known vulnerability in the locked dependencies blocks the release.
      - uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        with:
          tool: cargo-audit
      - run: cargo audit

  build:
    name: build (${{ matrix.target }})
    needs: plan
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write # Azure OIDC for Windows signing; unused when the secrets are missing.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          # Both macOS targets build on Apple silicon; x86_64 is cross-compiled and smoke-tested
          # under Rosetta (macos-15-intel is the last Intel image).
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          - { target: aarch64-pc-windows-msvc, os: windows-11-arm }
    env:
      TARGET: ${{ matrix.target }}
      VERSION: ${{ needs.plan.outputs.version }}
      # crates/core bundles SQLite (rusqlite), which cc compiles with musl-gcc on Linux.
      CC_x86_64_unknown_linux_musl: musl-gcc
      CC_aarch64_unknown_linux_musl: musl-gcc
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Install musl tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      # The arm64 partner images may ship without rustup.
      - name: Install rustup (Unix, when missing)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
      - name: Install rustup (Windows, when missing)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
            $arch = if ($env:PROCESSOR_ARCHITECTURE -eq 'ARM64') { 'aarch64' } else { 'x86_64' }
            Invoke-WebRequest "https://static.rust-lang.org/rustup/dist/$arch-pc-windows-msvc/rustup-init.exe" -OutFile rustup-init.exe
            ./rustup-init.exe -y --default-toolchain none --profile minimal
            Add-Content $env:GITHUB_PATH "$env:USERPROFILE\.cargo\bin"
          }
      - name: Toolchain from rust-toolchain.toml
        shell: bash
        run: |
          rustup show
          rustup target add "$TARGET"
      - name: Build
        shell: bash
        run: cargo build --release --locked --target "$TARGET" -p gitraptor-cli -p gitraptor-mcp
      - name: Stage binaries
        id: stage
        shell: bash
        run: |
          ext=""; [ "$RUNNER_OS" = Windows ] && ext=".exe"
          name="raptor-$VERSION-$TARGET"
          mkdir -p "stage/$name"
          cp "target/$TARGET/release/raptor$ext" "target/$TARGET/release/raptor-mcp$ext" "stage/$name/"
          cp README.md LICENSE "stage/$name/"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "ext=$ext" >> "$GITHUB_OUTPUT"
      # Only `raptor --version`: it exits before touching the profile. `raptor-mcp` would start
      # the engine, so it is never run here (NFR-01).
      - name: Smoke test
        shell: bash
        env:
          NAME: ${{ steps.stage.outputs.name }}
          EXT: ${{ steps.stage.outputs.ext }}
        run: |
          bin="stage/$NAME/raptor$EXT"
          if [ "$TARGET" = x86_64-apple-darwin ]; then out=$(arch -x86_64 "$bin" --version); else out=$("$bin" --version); fi
          echo "$out"
          [ "$out" = "raptor $VERSION" ] || { echo "::error::unexpected version: $out"; exit 1; }
          if [ "$RUNNER_OS" = Linux ]; then
            file "$bin"
            file "$bin" | grep -Eq "statically linked|static-pie linked" || { echo "::error::not a static binary"; exit 1; }
          fi

      # macOS: Developer ID + hardened runtime + notarization (ADR-GRP-014 § 4).
      # Requires secret: APPLE_CERTIFICATE_P12_BASE64, APPLE_CERTIFICATE_PASSWORD,
      # APPLE_SIGNING_IDENTITY, APPLE_API_KEY_P8_BASE64, APPLE_API_KEY_ID, APPLE_API_ISSUER_ID.
      - name: Sign and notarize (macOS)
        if: runner.os == 'macOS'
        env:
          NAME: ${{ steps.stage.outputs.name }}
          P12: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          API_KEY: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          if [ -z "$P12" ] || [ -z "$API_KEY" ]; then
            echo "::warning::macOS binaries are only ad-hoc signed: requires secret APPLE_CERTIFICATE_P12_BASE64 and APPLE_API_KEY_P8_BASE64"
            # The arm64 linker signs ad hoc on its own; the cross-compiled x86_64 build is not.
            for bin in raptor raptor-mcp; do
              codesign --force --sign - "stage/$NAME/$bin"
              codesign --verify --verbose "stage/$NAME/$bin"
            done
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"; kpass=$(uuidgen)
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$kpass" "$keychain"
          security set-keychain-settings -lut 900 "$keychain"
          security unlock-keychain -p "$kpass" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$kpass" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain"
          for bin in raptor raptor-mcp; do
            codesign --force --options runtime --timestamp --keychain "$keychain" \
              --sign "$IDENTITY" "stage/$NAME/$bin"
          done
          echo "$API_KEY" | base64 --decode > "$RUNNER_TEMP/key.p8"
          ditto -c -k --keepParent "stage/$NAME" "$RUNNER_TEMP/notarize.zip"
          # A bare binary cannot be stapled: Gatekeeper fetches the ticket online (the OS, not
          # the engine, so NFR-03 holds).
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --key "$RUNNER_TEMP/key.p8" \
            --key-id "$API_KEY_ID" --issuer "$API_ISSUER" --wait
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/key.p8"
          security delete-keychain "$keychain"

      # Windows: Azure Artifact Signing with a federated (OIDC) credential, no client secret.
      # Requires secret: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SIGNING_ENDPOINT,
      # AZURE_SIGNING_ACCOUNT, AZURE_CERTIFICATE_PROFILE.
      - name: Check Windows signing secrets
        id: winsign
        if: runner.os == 'Windows'
        shell: bash
        env:
          CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        run: |
          if [ -n "$CLIENT_ID" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"; else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Windows binaries are unsigned: requires secret AZURE_CLIENT_ID (and the other AZURE_* secrets)"
          fi
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        if: steps.winsign.outputs.enabled == 'true'
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        if: steps.winsign.outputs.enabled == 'true'
        with:
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERTIFICATE_PROFILE }}
          files-folder: stage/${{ steps.stage.outputs.name }}
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-digest: SHA256

      - name: Archive
        shell: bash
        env:
          NAME: ${{ steps.stage.outputs.name }}
        run: |
          mkdir -p out
          if [ "$RUNNER_OS" = Windows ]; then
            pwsh -NoProfile -Command "Compress-Archive -Path 'stage/$NAME' -DestinationPath 'out/$NAME.zip'"
          else
            tar -C stage -czf "out/$NAME.tar.gz" "$NAME"
          fi
          ls -l out
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: archive-${{ matrix.target }}
          path: out/*
          if-no-files-found: error

  sbom:
    name: sbom
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Toolchain from rust-toolchain.toml
        run: rustup show
      - uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        with:
          tool: cargo-cyclonedx
      # One CycloneDX SBOM per shipped crate (raptor and raptor-mcp), from Cargo.lock.
      - env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          cargo cyclonedx --format json
          mkdir -p out
          for crate in cli mcp; do
            src=$(find "apps/$crate" -maxdepth 1 -name '*.cdx.json' | head -1)
            [ -n "$src" ] || { echo "::error::no SBOM for apps/$crate"; exit 1; }
            cp "$src" "out/raptor-$VERSION-sbom-$crate.cdx.json"
          done
          ls -l out
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: out/*
          if-no-files-found: error

  assemble:
    name: checksums and channels
    needs: [plan, build, sbom]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Sigstore, only when RELEASE_ATTEST is enabled.
      attestations: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum raptor-* | sort -k2 > SHA256SUMS
          for f in raptor-*; do sha256sum "$f" > "$f.sha256"; done
          cat SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Install scripts
        run: cp packaging/install/install.sh packaging/install/install.ps1 dist/
      - name: Render channels (Homebrew, winget, npm)
        run: |
          node packaging/render-channels.mjs --version "$VERSION" --dist dist --out channels \
            --repo "$GITHUB_REPOSITORY"
          find channels -type f | sort
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: vars.RELEASE_ATTEST == 'true' && needs.plan.outputs.release == 'true'
        with:
          subject-path: dist/raptor-*-*-*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: channels
          path: channels/
          if-no-files-found: error

  test-installers:
    name: install script (${{ matrix.os }})
    needs: [plan, assemble]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: dist
      - name: install.sh installs and verifies
        if: runner.os != 'Windows'
        shell: bash
        run: |
          base="file://$GITHUB_WORKSPACE/dist"
          dir="$RUNNER_TEMP/bin"
          RAPTOR_DOWNLOAD_BASE="$base" RAPTOR_INSTALL_DIR="$dir" sh dist/install.sh --version "$VERSION"
          out=$("$dir/raptor" --version); echo "$out"; [ "$out" = "raptor $VERSION" ]
          test -x "$dir/raptor-mcp"
          # A tampered checksum must abort before anything is installed.
          mkdir -p "$RUNNER_TEMP/bad"; cp dist/* "$RUNNER_TEMP/bad/"
          sed -i.bak -E "s/^[0-9a-f]{64}/$(printf '0%.0s' $(seq 64))/" "$RUNNER_TEMP/bad/SHA256SUMS"
          if RAPTOR_DOWNLOAD_BASE="file://$RUNNER_TEMP/bad" RAPTOR_INSTALL_DIR="$RUNNER_TEMP/bad-bin" \
              sh dist/install.sh --version "$VERSION"; then
            echo "::error::install.sh accepted a tampered checksum"; exit 1
          fi
          [ ! -e "$RUNNER_TEMP/bad-bin/raptor" ] || { echo "::error::installed despite the mismatch"; exit 1; }
      - name: install.ps1 installs and verifies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'bin'
          $env:RAPTOR_DOWNLOAD_BASE = Join-Path $env:GITHUB_WORKSPACE 'dist'
          $env:RAPTOR_INSTALL_DIR = $dir
          ./dist/install.ps1 -Version $env:VERSION
          $out = & (Join-Path $dir 'raptor.exe') --version
          Write-Output $out
          if ($out -ne "raptor $env:VERSION") { throw "unexpected version: $out" }
          if (-not (Test-Path (Join-Path $dir 'raptor-mcp.exe'))) { throw 'raptor-mcp.exe missing' }
          $bad = Join-Path $env:RUNNER_TEMP 'bad'
          New-Item -ItemType Directory $bad | Out-Null
          Copy-Item dist/* $bad
          (Get-Content (Join-Path $bad 'SHA256SUMS')) -replace '^[0-9a-f]{64}', ('0' * 64) | Set-Content (Join-Path $bad 'SHA256SUMS')
          $env:RAPTOR_DOWNLOAD_BASE = $bad
          $env:RAPTOR_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'bad-bin'
          $failed = $false
          try { ./dist/install.ps1 -Version $env:VERSION } catch { $failed = $true; Write-Output "rejected: $_" }
          if (-not $failed) { throw 'install.ps1 accepted a tampered checksum' }
          if (Test-Path (Join-Path $env:RAPTOR_INSTALL_DIR 'raptor.exe')) { throw 'installed despite the mismatch' }

  draft-release:
    name: draft GitHub Release
    needs: [plan, assemble, test-installers]
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.plan.outputs.tag }}
      VERSION: ${{ needs.plan.outputs.version }}
      PRERELEASE: ${{ needs.plan.outputs.prerelease }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: dist
      # Always a draft: publishing it is a human decision (ADR-GRP-014 § 3).
      - run: |
          flags=(--draft)
          [ "$PRERELEASE" = true ] && flags+=(--prerelease)
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" != true ]; then
              echo "::error::release $TAG is already published; refusing to replace its assets"; exit 1
            fi
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* "${flags[@]}" --verify-tag --title "GitRaptor $VERSION" \
              --notes "Draft built by $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. Verify downloads with SHA256SUMS."
          fi
          gh release view "$TAG" --json url,isDraft,isPrerelease,assets --jq '{url, isDraft, isPrerelease, assets: [.assets[].name]}'
