# TS-CKP-004: `crates/theme/src/generated.rs` must match `packages/design-tokens` (ADR-GRP-003).
#
# Regenerates the Rust module from the tokens and fails if the committed file differs, then runs
# the package tests (completeness, ASCII fallbacks, the control itself). The Rust side (contrast
# gate, NO_COLOR, ASCII, agents) runs in `repo-intact.yml` with `cargo test --workspace`.
#
# Actions are pinned by commit SHA.
name: tokens

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Pull requests: one run per branch, a new push cancels the previous one. main never cancels.
concurrency:
  group: tokens-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  generated-up-to-date:
    name: tokens up to date
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      # Pull requests that touch none of these paths still report the check, in success, without
      # running it. `push` to main always runs it. The filter reads the changed files from the API,
      # which lists at most 3000: a larger pull request always runs the check.
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            changed:
              - 'packages/design-tokens/**'
              - 'crates/theme/src/generated.rs'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/tokens.yml'
      - name: Nothing to check
        if: steps.filter.outputs.changed == 'false' && github.event.pull_request.changed_files < 3000
        run: "echo '::notice::No token inputs changed in this pull request: check not needed (main always runs it)'"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: steps.filter.outputs.changed != 'false' || github.event.pull_request.changed_files >= 3000
      # Version from `packageManager` in package.json.
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        if: steps.filter.outputs.changed != 'false' || github.event.pull_request.changed_files >= 3000
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.filter.outputs.changed != 'false' || github.event.pull_request.changed_files >= 3000
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.filter.outputs.changed != 'false' || github.event.pull_request.changed_files >= 3000
      - name: Generated theme matches the tokens
        if: steps.filter.outputs.changed != 'false' || github.event.pull_request.changed_files >= 3000
        run: pnpm --filter @gitraptor/tokens check
      - run: pnpm --filter @gitraptor/tokens test
        if: steps.filter.outputs.changed != 'false' || github.event.pull_request.changed_files >= 3000
