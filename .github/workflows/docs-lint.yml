# docs-lint: every Mermaid block in docs/**/*.md must render (Mermaid CLI on headless Chrome).
# Added after four sequence diagrams broke on `;` in messages (PR #48) with no check to catch it.
#
# Actions are pinned by commit SHA.
name: docs-lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: docs-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-lint:
    name: docs-lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/docs-lint/package-lock.json
      # Isolated from the pnpm workspace: only CI needs Chrome and the Mermaid CLI.
      - name: Install the Mermaid CLI
        working-directory: tools/docs-lint
        run: npm ci --no-audit --no-fund
      - name: Render every Mermaid block
        working-directory: tools/docs-lint
        run: node check-mermaid.mjs
