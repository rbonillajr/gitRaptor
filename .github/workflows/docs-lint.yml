# docs-lint: every Mermaid block in docs/**/*.md must render (Mermaid CLI on headless Chrome).
# Added after four sequence diagrams broke on `;` in messages (PR #48) with no check to catch it.
# It also fails when docs/requirements/release-status.md is not what tools/status/release-status.mjs
# generates from the story cards (same job, so the set of required checks does not change).
#
# Actions are pinned by commit SHA.
name: docs-lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Pull requests: one run per branch, a new push cancels the previous one. main never cancels.
concurrency:
  group: docs-lint-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs-lint:
    name: docs-lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      # Pull requests that touch none of these paths still report the check, in success, without
      # running it. `push` to main always runs it. The filter reads the changed files from the API,
      # which lists at most 3000: a larger pull request always runs the check.
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            changed:
              - 'docs/**'
              - 'tools/docs-lint/**'
              - 'tools/status/**'
              - 'tools/dogfooding/**'
              - '.github/workflows/docs-lint.yml'
      - name: Nothing to check
        if: steps.filter.outputs.changed == 'false' && github.event.pull_request.changed_files < 3000
        run: "echo '::notice::No docs changes in this pull request: Mermaid and release status checks not needed (main always runs them)'"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: steps.filter.outputs.changed != 'false' || github.event.pull_request.changed_files >= 3000
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.filter.outputs.changed != 'false' || github.event.pull_request.changed_files >= 3000
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/docs-lint/package-lock.json
      # No dependencies: runs before the Mermaid CLI install so a stale file fails fast.
      - name: Test the release status generator
        if: steps.filter.outputs.changed != 'false' || github.event.pull_request.changed_files >= 3000
        run: node --test tools/status/release-status.test.mjs
      - name: Test the dogfooding log
        if: steps.filter.outputs.changed != 'false' || github.event.pull_request.changed_files >= 3000
        run: node --test tools/dogfooding/dogfooding.test.mjs
      - name: Release status is up to date
        if: steps.filter.outputs.changed != 'false' || github.event.pull_request.changed_files >= 3000
        run: node tools/status/release-status.mjs --check
      # Isolated from the pnpm workspace: only CI needs Chrome and the Mermaid CLI.
      - name: Install the Mermaid CLI
        if: steps.filter.outputs.changed != 'false' || github.event.pull_request.changed_files >= 3000
        working-directory: tools/docs-lint
        run: npm ci --no-audit --no-fund
      - name: Render every Mermaid block
        if: steps.filter.outputs.changed != 'false' || github.event.pull_request.changed_files >= 3000
        working-directory: tools/docs-lint
        run: node check-mermaid.mjs
