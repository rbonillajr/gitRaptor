# Every crate and package declares FSL-1.1-ALv2 and the root LICENSE holds its text
# (ADR-GRP-014 § 6, NFR-11). Read-only: `cargo metadata --no-deps` and jq over package.json.
#
# Actions are pinned by commit SHA.
name: license

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Pull requests: one run per branch, a new push cancels the previous one. main never cancels.
concurrency:
  group: license-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  declared:
    name: license declared
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      # Pull requests that touch none of these paths still report the check, in success, without
      # running it. `push` to main always runs it. The filter reads the changed files from the API,
      # which lists at most 3000: a larger pull request always runs the check.
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            changed:
              - 'LICENSE'
              - 'Cargo.toml'
              - '**/Cargo.toml'
              - 'package.json'
              - '**/package.json'
              - 'tools/check-license.sh'
              - 'rust-toolchain.toml'
              - '.github/workflows/license.yml'
      - name: Nothing to check
        if: steps.filter.outputs.changed == 'false' && github.event.pull_request.changed_files < 3000
        run: "echo '::notice::No license inputs changed in this pull request: check not needed (main always runs it)'"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: steps.filter.outputs.changed != 'false' || github.event.pull_request.changed_files >= 3000
      - name: Toolchain from rust-toolchain.toml
        if: steps.filter.outputs.changed != 'false' || github.event.pull_request.changed_files >= 3000
        run: rustup show
      - run: tools/check-license.sh
        if: steps.filter.outputs.changed != 'false' || github.event.pull_request.changed_files >= 3000
