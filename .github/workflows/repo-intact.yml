# INF-GRP-001: "intact repo" gate (BR-CONS-001, NFR-01, ADR-GRP-009 § Validación).
#
# Branch protection requires `lint and test (<os>)` and `repo-intact (<os>)` on all three OSes.
# Every suite registers itself by naming its tests `repo_intact::…`, so a new suite is gated as
# soon as it lands with its owning story, without touching branch protection.
#
# One build per OS: `lint and test` compiles the workspace once and runs both the regular tests
# and the `repo_intact` suites (with the OS tracer), and records the suites' outcome. The
# `repo-intact` jobs are thin gates on Linux that read that outcome, so the workspace is no longer
# built twice per OS and no macOS or Windows runner is taken twice.
#
# Path filter: a pull request that touches no Rust input still reports every required check, in
# success, on a Linux runner and without building. `push` to main and manual runs always run all.
#
# Affected (ADR-GRP-002, Enmienda 2026-10-07): on a pull request with Rust changes, the general
# tests run only for the Cargo packages the Nx graph marks as affected and their dependents, in
# one cargo invocation. fmt, clippy and the `repo_intact` suites stay on the whole workspace.
# Every doubt runs the whole workspace: main, a global input, an Nx step that failed, or a
# selection that would recompile (`tools/ci/cargo-test-selection.sh`).
#
# Actions are pinned by commit SHA.
name: repo-intact

on:
  pull_request:
  push:
    branches: [main]
  # Manual only: the eslogger deep audit (see `deep-exec-audit-macos`).
  workflow_dispatch:

permissions:
  contents: read

# Pull requests: one run per branch, a new push cancels the previous one. main and manual runs
# get a group of their own, so they are never cancelled.
concurrency:
  group: repo-intact-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # 'false' only on a pull request whose filter succeeded and found no Rust input; anything
      # else runs everything. The API lists at most 3000 files, so a larger PR always runs.
      rust: ${{ github.event_name != 'pull_request' || steps.filter.outcome != 'success' || github.event.pull_request.changed_files >= 3000 || steps.filter.outputs.rust == 'true' }}
      # The general tests: `affected` (with `test_projects`) or `full`. Anything but a successful
      # Nx step on a pull request is `full`.
      test_scope: ${{ steps.affected.outcome == 'success' && steps.affected.outputs.scope || 'full' }}
      test_projects: ${{ steps.affected.outcome == 'success' && steps.affected.outputs.projects || '' }}
      graph_ok: ${{ steps.affected.outputs.graph_ok != 'false' }}
    steps:
      # On pull requests the filter reads the changed files from the API: no checkout needed.
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'apps/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'rust-toolchain'
              - '.cargo/**'
              - 'rustfmt.toml'
              - '.rustfmt.toml'
              - 'clippy.toml'
              - '.clippy.toml'
              - '.gitattributes'
              - '.github/workflows/repo-intact.yml'
      # Nx on a pull request with Rust changes: the merge commit and its first parent (the base)
      # are enough to diff. None of these steps can fail the job: without a list, everything runs.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: steps.filter.outputs.rust == 'true'
        continue-on-error: true
        with:
          fetch-depth: 2
      # Version from `packageManager` in package.json.
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        if: steps.filter.outputs.rust == 'true'
        continue-on-error: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.filter.outputs.rust == 'true'
        continue-on-error: true
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.filter.outputs.rust == 'true'
        continue-on-error: true
        timeout-minutes: 5
      - id: affected
        if: steps.filter.outputs.rust == 'true'
        continue-on-error: true
        timeout-minutes: 5
        env:
          # Only `cargo metadata` runs here: the runner's stable toolchain answers it without
          # installing the pinned one.
          RUSTUP_TOOLCHAIN: stable
        run: BASE=$(git rev-parse HEAD^1) HEAD=$(git rev-parse HEAD) node tools/ci/affected-tests.mjs

  lint-and-test:
    name: lint and test (${{ matrix.os }})
    needs: changes
    # Without Rust changes the check still reports, from a Linux runner, so a docs-only pull
    # request never waits for a macOS or Windows runner.
    runs-on: ${{ needs.changes.outputs.rust == 'false' && 'ubuntu-latest' || matrix.os }}
    # A normal run takes 3-7 minutes; the ceiling leaves room for a cold cache and stops a hung
    # runner long before GitHub's 6-hour default.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux: strace traces the probe's own process tree without root; blocking.
          # `repo_intact_min`: the `repo_intact` tests the gate must execute on that OS (passed plus
          # failed). Fewer fails the gate, so a filter that matches nothing, or a suite that stops
          # matching it, never passes green. Raise it when a suite lands; lower it only on purpose.
          - os: ubuntu-latest
            exec_audit: strace
            repo_intact_min: 96
          # macOS: the trap gate is blocking; eslogger runs in `deep-exec-audit-macos`.
          - os: macos-latest
            exec_audit: auto
            repo_intact_min: 103
          # Windows: trap gate only; ETW is pending (Dev Spec § 6).
          - os: windows-latest
            exec_audit: auto
            repo_intact_min: 75
    env:
      # Not RUST_* or CARGO_*: rust-cache hashes those into its key, and a new value would miss
      # main's cache.
      BUILD_RUST: ${{ needs.changes.outputs.rust }}
    steps:
      - name: No Rust changes
        if: env.BUILD_RUST == 'false'
        run: "echo '::notice::No Rust input changed in this pull request: nothing to build (main always runs everything)'"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: env.BUILD_RUST != 'false'
      - name: Install strace
        if: env.BUILD_RUST != 'false' && matrix.exec_audit == 'strace'
        # apt mirrors have hung this step for hours (2026-10-07); it normally takes seconds.
        timeout-minutes: 5
        run: sudo apt-get update && sudo apt-get install -y strace
      - name: Toolchain from rust-toolchain.toml
        if: env.BUILD_RUST != 'false'
        run: rustup show
      # rust-cache keys by job, OS, arch, rustc version and Cargo.lock
      # (`v0-rust-lint-and-test-<OS>-<arch>-<rustc>-<lock>`). Only main saves: pull request caches
      # used to push the repo past the 10 GB limit and evict main's.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: env.BUILD_RUST != 'false'
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - id: fmt
        if: env.BUILD_RUST != 'false'
        run: cargo fmt --all -- --check
      - id: clippy
        if: env.BUILD_RUST != 'false'
        run: cargo clippy --workspace --all-targets -- -D warnings
      # The `repo-intact` gate. Always the whole workspace, never `nx affected`: the gate must run
      # every suite. It runs first among the tests, on a runner no other test has loaded yet (as the
      # separate job did), and even when fmt or clippy failed, so the gate reports on its own
      # suites. Windows: non-blocking (Pendiente: etapa de validación multiplataforma).
      # The output goes to a log too, to count the tests. Each OS keeps its default shell, so the
      # suites run in the same environment as before (Git Bash would change PATH on Windows).
      - name: Core and registered repo_intact suites
        id: suites
        if: ${{ !cancelled() && env.BUILD_RUST != 'false' && matrix.os != 'windows-latest' }}
        env:
          GITRAPTOR_EXEC_AUDIT: ${{ matrix.exec_audit }}
        run: |
          set -o pipefail
          cargo test --workspace --no-fail-fast -- repo_intact | tee repo-intact-suites.log
      - name: Core and registered repo_intact suites
        id: suites_windows
        if: ${{ !cancelled() && env.BUILD_RUST != 'false' && matrix.os == 'windows-latest' }}
        env:
          GITRAPTOR_EXEC_AUDIT: ${{ matrix.exec_audit }}
        run: cargo test --workspace --no-fail-fast -- repo_intact | Tee-Object -FilePath repo-intact-suites.log
        continue-on-error: true
      # Empty-gate guard: the suites pass only if they executed at least `repo_intact_min` tests,
      # counted from every `test result:` line (the libtest ones and the `harness = false` one).
      - name: Record the repo_intact outcome
        id: record
        if: ${{ !cancelled() && env.BUILD_RUST != 'false' }}
        shell: bash
        env:
          OS: ${{ matrix.os }}
          SUITES: ${{ matrix.os == 'windows-latest' && steps.suites_windows.outcome || steps.suites.outcome }}
          MIN: ${{ matrix.repo_intact_min }}
        run: |
          touch repo-intact-suites.log
          executed=$(tr -d '\r' < repo-intact-suites.log | sed 's/\x1b\[[0-9;]*m//g' \
            | awk '/^test result: /{for (i = 1; i < NF; i++) if ($(i + 1) ~ /^(passed|failed);$/) n += $i} END {print n + 0}')
          outcome=$SUITES
          if [ "$outcome" = success ] && [ "$executed" -lt "$MIN" ]; then
            echo "::error::repo_intact suites on $OS executed $executed tests, fewer than the $MIN required: the gate filter no longer selects them"
            outcome=failure
          fi
          echo "repo_intact suites on $OS: $outcome, $executed tests executed (minimum $MIN)"
          printf '%s\n%s\n' "$outcome" "$executed" > repo-intact-outcome.txt
          if [ "$outcome" != success ] && [ "$SUITES" = success ]; then exit 1; fi
        continue-on-error: ${{ matrix.os == 'windows-latest' }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() && env.BUILD_RUST != 'false' }}
        with:
          name: repo-intact-${{ matrix.os }}
          path: repo-intact-outcome.txt
          retention-days: 1
          # A re-run of the job replaces the record, so the gate reads the latest attempt.
          overwrite: true
      # A test that launches another package's binary must reach it in the Nx graph, or a change to
      # that package would skip the test (`tools/ci/affected-tests.mjs`). Blocking, once.
      - name: Nx graph covers the binaries the tests launch
        if: ${{ env.BUILD_RUST != 'false' && matrix.os == 'ubuntu-latest' && needs.changes.outputs.graph_ok == 'false' }}
        run: "echo '::error::the Nx graph misses a dependency a test needs: see the changes job'; exit 1"
      - name: Select the general tests
        id: select
        if: ${{ !cancelled() && steps.fmt.outcome == 'success' && steps.clippy.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        env:
          SCOPE: ${{ github.event_name == 'pull_request' && needs.changes.outputs.test_scope || 'full' }}
          PROJECTS: ${{ needs.changes.outputs.test_projects }}
        run: bash tools/ci/cargo-test-selection.sh
      # Windows: TS-GRP-002 rejects every Git candidate on Windows (fail-closed until the ACE
      # check exists) and the canary uses /bin/sh scripts, so the tests cannot pass there yet.
      # Pendiente: etapa de validación multiplataforma. The step never fails the job on Windows;
      # fmt and clippy stay blocking everywhere. Runs after the gate even when it failed, so a
      # failing suite does not hide the other tests' results.
      - id: test
        if: ${{ !cancelled() && steps.fmt.outcome == 'success' && steps.clippy.outcome == 'success' }}
        run: cargo test ${{ steps.select.outputs.args || '--workspace' }} -- --skip repo_intact
        continue-on-error: ${{ matrix.os == 'windows-latest' }}
      - name: Pending on Windows
        if: steps.test.outcome == 'failure'
        run: "echo '::warning::cargo test failed on Windows. Pendiente: etapa de validación multiplataforma'"
      # Blocking on Windows too: the only crate with `unsafe` and the requester
      # resolution on real processes (ADR-GRP-005, Enmienda 2026-10-05).
      - name: Windows processes and requester (blocking)
        if: ${{ !cancelled() && steps.clippy.outcome == 'success' && matrix.os == 'windows-latest' }}
        run: |
          cargo test -p gitraptor-winsys
          cargo test -p gitraptor-core --lib -- channel::requester channel::peer channel::authz channel::marks children_of_the_step_are_marked

  repo-intact:
    name: repo-intact (${{ matrix.os }})
    needs: [changes, lint-and-test]
    # Reports even when lint failed: the verdict is the suites' own outcome. A missing outcome
    # (lint-and-test cancelled or never run) fails the gate: fail-closed.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      # Skip only on an explicit 'false' from a `changes` job that succeeded.
      SKIP: ${{ needs.changes.result == 'success' && needs.changes.outputs.rust == 'false' }}
    steps:
      - name: Path filter did not run
        if: needs.changes.result != 'success'
        run: "echo '::error::the changes job did not succeed: cannot tell whether Rust changed'; exit 1"
      - name: No Rust changes
        if: env.SKIP == 'true'
        run: "echo '::notice::No Rust input changed in this pull request: nothing to gate (main always runs everything)'"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: env.SKIP != 'true'
        with:
          name: repo-intact-${{ matrix.os }}
      - name: repo_intact suites on ${{ matrix.os }}
        if: env.SKIP != 'true'
        env:
          OS: ${{ matrix.os }}
        run: |
          outcome=$(sed -n 1p repo-intact-outcome.txt)
          executed=$(sed -n 2p repo-intact-outcome.txt)
          echo "repo_intact suites on $OS: $outcome, ${executed:-no} tests executed"
          # Defense in depth: a success with no tests is not a success.
          if [ "$outcome" = success ] && ! [ "${executed:-0}" -gt 0 ] 2>/dev/null; then
            echo "::error::repo_intact suites on $OS reported success with no tests executed"
            outcome=failure
          fi
          if [ "$outcome" = success ]; then exit 0; fi
          if [ "$OS" = windows-latest ]; then
            echo "::warning::repo_intact suites failed on Windows. Pendiente: etapa de validación multiplataforma"
            exit 0
          fi
          echo "::error::repo_intact suites on $OS: $outcome (see lint and test ($OS))"
          exit 1

  # US-GRD-001 (ADR-GRD-001 Validación 13, INF-GRD-001 D11): the Guardrails suites with the
  # minimum supported Git (NFR-07), built from the kernel.org tarball checked by SHA-256 and
  # cached. Blocking: Git 2.38 hands a deletion through HEAD over as `HEAD` (SPIKE-GRD-001 D09).
  guardrails-git-min:
    name: guardrails (Git 2.38.5, Linux)
    runs-on: ubuntu-latest
    # A normal run takes 1-2 minutes; a cache miss also builds Git from source.
    timeout-minutes: 30
    env:
      GIT_MIN_VERSION: 2.38.5
      GIT_MIN_SHA256: f1b3d39684545a1954a3ab6e11972405c8eb2cf16ae069e96d0502d97843aea5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Toolchain from rust-toolchain.toml
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Cache Git ${{ env.GIT_MIN_VERSION }}
        id: git-min
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/git-min
          key: git-${{ env.GIT_MIN_VERSION }}-${{ runner.os }}-${{ env.GIT_MIN_SHA256 }}
      - name: Build Git ${{ env.GIT_MIN_VERSION }}
        if: steps.git-min.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y zlib1g-dev
          curl -fsSLo /tmp/git.tar.xz "https://mirrors.edge.kernel.org/pub/software/scm/git/git-$GIT_MIN_VERSION.tar.xz"
          echo "$GIT_MIN_SHA256  /tmp/git.tar.xz" | sha256sum -c -
          tar -xJf /tmp/git.tar.xz -C /tmp
          make -C "/tmp/git-$GIT_MIN_VERSION" -j"$(nproc)" prefix="$HOME/git-min" \
            NO_TCLTK=1 NO_GETTEXT=1 NO_CURL=1 NO_EXPAT=1 NO_PERL=1 NO_PYTHON=1 all install >/dev/null
      - name: Guardrails suites
        run: |
          export PATH="$HOME/git-min/bin:$PATH"
          git version
          cargo test -p gitraptor-cli --test guard_us_grd_001
          cargo test -p gitraptor-policy guard
          cargo test -p gitraptor-core --test guard_evaluate --test guard_boundary

  deep-exec-audit-macos:
    name: deep exec audit (macOS, eslogger)
    runs-on: macos-latest
    # eslogger needs root and a TCC Full Disk Access grant that hosted runners do not have, so
    # it runs only on a manual trigger (on a runner that has the grant), never on PRs or pushes.
    if: github.event_name == 'workflow_dispatch'
    continue-on-error: true
    env:
      GITRAPTOR_EXEC_AUDIT: eslogger
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Toolchain from rust-toolchain.toml
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test -p gitraptor-git --test repo_intact_exec -- kernel_tracer
