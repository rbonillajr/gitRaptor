# INF-GRP-001: "intact repo" gate (BR-CONS-001, NFR-01, ADR-GRP-009 § Validación).
#
# Proposal, not yet run on GitHub (see the INF-GRP-001 Dev Spec). Branch protection should require
# only the `repo-intact` jobs: every suite registers itself by naming its tests `repo_intact::…`,
# so a new suite is gated as soon as it lands with its owning story, without touching branch
# protection, and an earlier story is never blocked by a suite that does not exist yet.
#
# Actions are pinned by commit SHA.
name: repo-intact

on:
  pull_request:
  push:
    branches: [main]
  # Manual only: the eslogger deep audit (see `deep-exec-audit-macos`).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repo-intact-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-and-test:
    name: lint and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Toolchain from rust-toolchain.toml
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Windows: TS-GRP-002 rejects every Git candidate on Windows (fail-closed until the ACE
      # check exists) and the canary uses /bin/sh scripts, so the tests cannot pass there yet.
      # Pendiente: etapa de validación multiplataforma. The step never fails the job on Windows;
      # fmt and clippy stay blocking everywhere.
      - id: test
        run: cargo test --workspace
        continue-on-error: ${{ matrix.os == 'windows-latest' }}
      - name: Pending on Windows
        if: steps.test.outcome == 'failure'
        run: "echo '::warning::cargo test failed on Windows. Pendiente: etapa de validación multiplataforma'"

  repo-intact:
    name: repo-intact (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux: strace traces the probe's own process tree without root; blocking.
          - os: ubuntu-latest
            exec_audit: strace
          # macOS: the trap gate is blocking; eslogger runs in `deep-exec-audit-macos`.
          - os: macos-latest
            exec_audit: auto
          # Windows: trap gate only; ETW is pending (Dev Spec § 6).
          - os: windows-latest
            exec_audit: auto
    env:
      GITRAPTOR_EXEC_AUDIT: ${{ matrix.exec_audit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install strace
        if: matrix.exec_audit == 'strace'
        run: sudo apt-get update && sudo apt-get install -y strace
      - name: Toolchain from rust-toolchain.toml
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Always the whole workspace, never `nx affected`: the gate must run every suite.
      # Windows: non-blocking (Pendiente: etapa de validación multiplataforma).
      - name: Core and registered suites
        id: suites
        run: cargo test --workspace -- repo_intact
        continue-on-error: ${{ matrix.os == 'windows-latest' }}
      - name: Pending on Windows
        if: steps.suites.outcome == 'failure'
        run: "echo '::warning::repo_intact suites failed on Windows. Pendiente: etapa de validación multiplataforma'"

  deep-exec-audit-macos:
    name: deep exec audit (macOS, eslogger)
    runs-on: macos-latest
    # eslogger needs root and a TCC Full Disk Access grant that hosted runners do not have, so
    # it runs only on a manual trigger (on a runner that has the grant), never on PRs or pushes.
    if: github.event_name == 'workflow_dispatch'
    continue-on-error: true
    env:
      GITRAPTOR_EXEC_AUDIT: eslogger
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Toolchain from rust-toolchain.toml
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test -p gitraptor-git --test repo_intact_exec -- kernel_tracer
