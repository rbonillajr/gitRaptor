# INF-GRP-001: "intact repo" gate (BR-CONS-001, NFR-01, ADR-GRP-009 § Validación).
#
# Proposal, not yet run on GitHub (see the INF-GRP-001 Dev Spec). Branch protection should require
# only the `repo-intact` jobs: every suite registers itself by naming its tests `repo_intact::…`,
# so a new suite is gated as soon as it lands with its owning story, without touching branch
# protection, and an earlier story is never blocked by a suite that does not exist yet.
#
# Actions are pinned by commit SHA.
name: repo-intact

on:
  pull_request:
  push:
    branches: [main]
  # Manual only: the eslogger deep audit (see `deep-exec-audit-macos`).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repo-intact-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-and-test:
    name: lint and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Toolchain from rust-toolchain.toml
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Windows: TS-GRP-002 rejects every Git candidate on Windows (fail-closed until the ACE
      # check exists) and the canary uses /bin/sh scripts, so the tests cannot pass there yet.
      # Pendiente: etapa de validación multiplataforma. The step never fails the job on Windows;
      # fmt and clippy stay blocking everywhere.
      - id: test
        run: cargo test --workspace
        continue-on-error: ${{ matrix.os == 'windows-latest' }}
      - name: Pending on Windows
        if: steps.test.outcome == 'failure'
        run: "echo '::warning::cargo test failed on Windows. Pendiente: etapa de validación multiplataforma'"
      # Blocking on Windows too: the only crate with `unsafe` and the requester
      # resolution on real processes (ADR-GRP-005, Enmienda 2026-10-05).
      - name: Windows processes and requester (blocking)
        if: matrix.os == 'windows-latest'
        run: |
          cargo test -p gitraptor-winsys
          cargo test -p gitraptor-core --lib -- channel::requester channel::peer channel::authz channel::marks children_of_the_step_are_marked

  repo-intact:
    name: repo-intact (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux: strace traces the probe's own process tree without root; blocking.
          - os: ubuntu-latest
            exec_audit: strace
          # macOS: the trap gate is blocking; eslogger runs in `deep-exec-audit-macos`.
          - os: macos-latest
            exec_audit: auto
          # Windows: trap gate only; ETW is pending (Dev Spec § 6).
          - os: windows-latest
            exec_audit: auto
    env:
      GITRAPTOR_EXEC_AUDIT: ${{ matrix.exec_audit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install strace
        if: matrix.exec_audit == 'strace'
        run: sudo apt-get update && sudo apt-get install -y strace
      - name: Toolchain from rust-toolchain.toml
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Always the whole workspace, never `nx affected`: the gate must run every suite.
      # Windows: non-blocking (Pendiente: etapa de validación multiplataforma).
      - name: Core and registered suites
        id: suites
        run: cargo test --workspace -- repo_intact
        continue-on-error: ${{ matrix.os == 'windows-latest' }}
      - name: Pending on Windows
        if: steps.suites.outcome == 'failure'
        run: "echo '::warning::repo_intact suites failed on Windows. Pendiente: etapa de validación multiplataforma'"

  # US-GRD-001 (ADR-GRD-001 Validación 13, INF-GRD-001 D11): the Guardrails suites with the
  # minimum supported Git (NFR-07), built from the kernel.org tarball checked by SHA-256 and
  # cached. Blocking: Git 2.38 hands a deletion through HEAD over as `HEAD` (SPIKE-GRD-001 D09).
  guardrails-git-min:
    name: guardrails (Git 2.38.5, Linux)
    runs-on: ubuntu-latest
    env:
      GIT_MIN_VERSION: 2.38.5
      GIT_MIN_SHA256: f1b3d39684545a1954a3ab6e11972405c8eb2cf16ae069e96d0502d97843aea5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Toolchain from rust-toolchain.toml
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Cache Git ${{ env.GIT_MIN_VERSION }}
        id: git-min
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/git-min
          key: git-${{ env.GIT_MIN_VERSION }}-${{ runner.os }}-${{ env.GIT_MIN_SHA256 }}
      - name: Build Git ${{ env.GIT_MIN_VERSION }}
        if: steps.git-min.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y zlib1g-dev
          curl -fsSLo /tmp/git.tar.xz "https://mirrors.edge.kernel.org/pub/software/scm/git/git-$GIT_MIN_VERSION.tar.xz"
          echo "$GIT_MIN_SHA256  /tmp/git.tar.xz" | sha256sum -c -
          tar -xJf /tmp/git.tar.xz -C /tmp
          make -C "/tmp/git-$GIT_MIN_VERSION" -j"$(nproc)" prefix="$HOME/git-min" \
            NO_TCLTK=1 NO_GETTEXT=1 NO_CURL=1 NO_EXPAT=1 NO_PERL=1 NO_PYTHON=1 all install >/dev/null
      - name: Guardrails suites
        run: |
          export PATH="$HOME/git-min/bin:$PATH"
          git version
          cargo test -p gitraptor-cli --test guard_us_grd_001
          cargo test -p gitraptor-policy guard
          cargo test -p gitraptor-core --test guard_evaluate --test guard_boundary

  deep-exec-audit-macos:
    name: deep exec audit (macOS, eslogger)
    runs-on: macos-latest
    # eslogger needs root and a TCC Full Disk Access grant that hosted runners do not have, so
    # it runs only on a manual trigger (on a runner that has the grant), never on PRs or pushes.
    if: github.event_name == 'workflow_dispatch'
    continue-on-error: true
    env:
      GITRAPTOR_EXEC_AUDIT: eslogger
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Toolchain from rust-toolchain.toml
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test -p gitraptor-git --test repo_intact_exec -- kernel_tracer
