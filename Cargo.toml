[workspace]
resolver = "3"
members = ["crates/*", "apps/cli", "apps/mcp", "apps/desktop/src-tauri"]
# The Tauri backend needs WebKitGTK on Linux: built only by its own CI job (ADR-GRP-002).
default-members = ["crates/*", "apps/cli", "apps/mcp"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "FSL-1.1-ALv2"
publish = false

[workspace.dependencies]
gitraptor-api = { path = "crates/api" }
gitraptor-core = { path = "crates/core" }
gitraptor-git = { path = "crates/git" }
gitraptor-macsys = { path = "crates/macsys" }
gitraptor-policy = { path = "crates/policy" }
gitraptor-testkit = { path = "crates/testkit" }
gitraptor-theme = { path = "crates/theme" }
gitraptor-winsys = { path = "crates/winsys" }

clap = { version = "4", features = ["derive"] }
# Read path of crates/git (ADR-GRP-001, ADR-GRP-009): no default features, so no network,
# credentials or worktree mutation; versions are pinned by Cargo.lock.
# `parallel` makes the repository handles thread-safe, so the Time Machine store writes blobs
# from several threads (ADR-TMC-006 § 5, escalón 3).
gix = { version = "0.89", default-features = false, features = ["sha1", "status", "revision", "excludes", "dirwalk", "parallel"] }
# Index of a seeded pack, regenerated in process (ADR-TMC-001 § 3); same version gix 0.88 uses.
gix-pack = { version = "0.76", default-features = false, features = ["sha1", "streaming-input"] }
# The Cockpit TUI (ADR-CKP-003 § 1): crossterm 0.29 backend, chosen by feature.
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29", "layout-cache"] }
# Snapshot tests of the TUI widgets (DSYS-GRP-001 § 7, TS-CKP-005).
insta = "1"
serde_json = "1"
tempfile = "3"
# Win32 calls of crates/winsys only (ADR-GRP-002); the version gix already brings in.
windows-sys = "0.61"
# sysctl of crates/macsys only (ADR-GRP-002, Enmienda 2026-10-07); the version the lock already has.
libc = "0.2.190"
# The desktop app backend (ADR-GRP-017): default features only, never `devtools`.
tauri = "=2.12.5"
tauri-build = "=2.7.4"
tauri-plugin-dialog = "=2.8.3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Dev and test builds keep file:line in backtraces but drop full debuginfo, and dependencies carry none.
# Full debuginfo was most of each worktree's 30-50 GB target/ and slowed linking on macOS (2026-11-08).
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
