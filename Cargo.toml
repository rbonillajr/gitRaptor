[workspace]
resolver = "3"
members = ["crates/*", "apps/cli", "apps/mcp"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "FSL-1.1-ALv2"
publish = false

[workspace.dependencies]
gitraptor-api = { path = "crates/api" }
gitraptor-core = { path = "crates/core" }
gitraptor-git = { path = "crates/git" }
gitraptor-policy = { path = "crates/policy" }
gitraptor-testkit = { path = "crates/testkit" }
gitraptor-theme = { path = "crates/theme" }
gitraptor-winsys = { path = "crates/winsys" }

clap = { version = "4", features = ["derive"] }
# Read path of crates/git (ADR-GRP-001, ADR-GRP-009): no default features, so no network,
# credentials or worktree mutation; versions are pinned by Cargo.lock.
# `parallel` makes the repository handles thread-safe, so the Time Machine store writes blobs
# from several threads (ADR-TMC-006 § 5, escalón 3).
gix = { version = "0.88", default-features = false, features = ["sha1", "status", "revision", "excludes", "dirwalk", "parallel"] }
# Index of a seeded pack, regenerated in process (ADR-TMC-001 § 3); same version gix 0.88 uses.
gix-pack = { version = "0.75", default-features = false, features = ["sha1", "streaming-input"] }
serde_json = "1"
tempfile = "3"
# Win32 calls of crates/winsys only (ADR-GRP-002); the version gix already brings in.
windows-sys = "0.61"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
