[package]
name = "gitraptor-cli"
description = "raptor: GitRaptor CLI and TUI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The TUI as an internal library (ADR-CKP-003 § 12), so tests and the bench drive the `App`
# without a screen. Not published.
[lib]
name = "gitraptor_cli"
path = "src/lib.rs"

[[bin]]
name = "raptor"
path = "src/main.rs"

# The native Guardrails dispatcher (US-GRD-001, ADR-GRD-001 § 2): plain `std`, copied into each
# protected repo's `.git/gitraptor/hooks/`.
[[bin]]
name = "raptor-hook"
path = "src/bin/raptor-hook.rs"

[dependencies]
gitraptor-api = { workspace = true, features = ["client"] }
gitraptor-core.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
gitraptor-theme.workspace = true
clap.workspace = true
ratatui.workspace = true
unicode-width = "0.2"

# Raw-ish mode for the OSC 11 background query of the TUI (TS-CKP-004, 2026-10-05).
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.5", features = ["termios", "process"] }

[lints]
workspace = true

[dev-dependencies]
# The chaos harness kills the daemon at its crash points (INF-TMC-001): test builds only.
gitraptor-core = { workspace = true, features = ["chaos"] }
gitraptor-git.workspace = true
gitraptor-testkit.workspace = true
tempfile.workspace = true
insta.workspace = true

# A pseudo-terminal plays the emulator in the OSC 11 tests.
[target.'cfg(unix)'.dev-dependencies]
rustix = { version = "1.1.5", features = ["termios", "pty"] }
# `setsid` for the simulated agent that runs without a terminal (US-GRP-009).
nix = { version = "=0.31.3", features = ["process"] }

# Freshness, scale and footprint bench of the engine (INF-GRP-002, ADR-GRP-011 § 4).
[[bench]]
name = "engine"
harness = false


# CPU of the daemon at rest with N agent sessions over M worktrees (RES-01, M1 criterion 5).
[[bench]]
name = "idle"
harness = false
