[package]
name = "gitraptor-cli"
description = "raptor: GitRaptor CLI and TUI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "raptor"
path = "src/main.rs"

[dependencies]
gitraptor-api.workspace = true
gitraptor-core.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
gitraptor-theme.workspace = true
clap.workspace = true

[lints]
workspace = true

[dev-dependencies]
gitraptor-git.workspace = true
gitraptor-testkit.workspace = true
tempfile.workspace = true

# Freshness, scale and footprint bench of the engine (INF-GRP-002, ADR-GRP-011 § 4).
[[bench]]
name = "engine"
harness = false
