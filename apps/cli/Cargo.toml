[package]
name = "gitraptor-cli"
description = "raptor: GitRaptor CLI and TUI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The TUI as an internal library (ADR-CKP-003 § 12), so tests and the bench drive the `App`
# without a screen. Not published.
[lib]
name = "gitraptor_cli"
path = "src/lib.rs"

[[bin]]
name = "raptor"
path = "src/main.rs"

[dependencies]
gitraptor-api.workspace = true
gitraptor-core.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
gitraptor-theme.workspace = true
clap.workspace = true
ratatui.workspace = true

[lints]
workspace = true

[dev-dependencies]
gitraptor-git.workspace = true
gitraptor-testkit.workspace = true
tempfile.workspace = true

# Freshness, scale and footprint bench of the engine (INF-GRP-002, ADR-GRP-011 § 4).
[[bench]]
name = "engine"
harness = false

[target.'cfg(unix)'.dev-dependencies]
# `setsid` for the simulated agent that runs without a terminal (US-GRP-009).
nix = { version = "=0.31.3", features = ["process"] }
