[package]
name = "gitraptor-mcp"
description = "raptor-mcp: GitRaptor MCP server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "raptor-mcp"
path = "src/main.rs"

[dependencies]
gitraptor-api = { workspace = true, features = ["client"] }
gitraptor-core.workspace = true
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json.workspace = true
# stdio only (ADR-MCP-001 § 1, NFR-03): no network transport, no client, no auth.
rmcp = { version = "3.5.0", default-features = false, features = ["server", "transport-io"] }
tokio = { version = "1", default-features = false, features = ["rt", "io-std", "time"] }

[lints]
workspace = true

[dev-dependencies]
tempfile.workspace = true
